[project]
name = "parts-research"
version = "0.1.0"
description = "Parts research system: research-agent + curator on top of OpenAI Agents SDK + Postgres"
requires-python = ">=3.13"
dependencies = [
    "openai-agents",
    "openai",
    "exa-py",
    "asyncpg",
    "pydantic",
    "python-dotenv",
    "fastapi",
    "uvicorn[standard]",
    "sqlparse",
]
# Python ставится глобально через mise (см. ~/.config/mise/config.toml).
# Пакеты — в системный site-packages этого mise-python:
#   python -m pip install -e .
# Запуск любого entry-point — `python -m parts_research.cli.<name>`.

[project.scripts]
parts-research = "parts_research.cli.research:main"
parts-research-worker = "parts_research.cli.worker:main"
parts-research-curator = "parts_research.cli.curator:main"
parts-research-api = "parts_research.cli.api:main"
parts-research-backfill-classes = "parts_research.cli.backfill_classes:main"
parts-research-curation-sweep = "parts_research.cli.curation_sweep:main"
parts-research-curate-hard-list = "parts_research.cli.curate_hard_list:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
