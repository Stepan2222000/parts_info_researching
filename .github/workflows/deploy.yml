# Сборка образов parts_research_api / parts_research_app через Docker Build Cloud
# (driver: cloud — кэш слоёв персистентный, на стороне облачного билдера) -> ghcr.io,
# затем SSH-выкат на сервер (git reset --hard + compose pull + up -d).
# push в main = собрать + выкатить.
name: build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: stepan2222000   # ghcr требует строчное имя

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: .
            dockerfile: Dockerfile
          - name: app
            context: ./web
            dockerfile: ./web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub (for Build Cloud)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx (cloud)
        uses: docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: "${{ secrets.DOCKERHUB_USERNAME }}/builder1"

      # Кэш — на стороне Build Cloud (общий, персистентный между прогонами),
      # поэтому cache-from/cache-to: type=gha не нужны.
      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/parts-research-${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/parts-research-${{ matrix.name }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: SSH deploy on server
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN
          script: |
            set -euo pipefail
            # Разовый вывод из эксплуатации старого кустарного деплоя (локальные образы
            # ghcr.io/local/*, занимал порт 3001). После первого прогона — no-op.
            if [ -f /root/parts_research_deploy/docker-compose.yml ]; then
              docker compose -p parts_research_deploy -f /root/parts_research_deploy/docker-compose.yml down 2>/dev/null || true
            fi
            cd /root/parts_research_app
            git fetch --quiet origin main
            git reset --hard origin/main
            export GHCR_OWNER=stepan2222000
            export TAG=latest
            # ghcr-логин эфемерным GITHUB_TOKEN прогона (packages:read) — не протухает,
            # в отличие от PAT: выдаётся заново на каждый деплой.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u stepan2222000 --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans worker api public-api app
            docker image prune -f
            docker compose ps
